services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akilli-kampus-yardim
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3002
    volumes:
      - prisma_data:/app/prisma
    restart: unless-stopped

volumes:
  prisma_data:
